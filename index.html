<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-WORLD · Creative Digital Realms</title>
  <meta name="description" content="E-World is a creative digital universe branching across Minecraft SMP, FiveM RP, and sanctioned esports leagues." />

  <!-- Favicon / SVG Icon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌌</text></svg>" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="./src/style/base.css" />
  <link rel="stylesheet" href="./src/style/components.css" />
  <link rel="stylesheet" href="./src/style/hud.css" />
  <link rel="stylesheet" href="./src/style/tree.css" />
  <link rel="stylesheet" href="./src/style/matrix.css" />
  <link rel="stylesheet" href="./src/style/cursor.css" />
</head>
<body>
  <!-- ACTIVE THEORY TECHNICAL FRAMING CROSSHAIRS (+) -->
  <div class="hud-corner hud-corner-tl">+</div>
  <div class="hud-corner hud-corner-tr">+</div>
  <div class="hud-corner hud-corner-bl">+</div>
  <div class="hud-corner hud-corner-br">+</div>
  <div class="hud-frame-line hud-line-top"></div>
  <div class="hud-frame-line hud-line-bottom"></div>

  <!-- FIXED THREE.JS 3D WEBGL CANVAS -->
  <div id="webgl-canvas-container"></div>

  <!-- DYNAMIC AMBIENT LIGHTING LAYER -->
  <div id="ambient-glow-layer"></div>

  <!-- LIQUID CURSOR & SPATIAL MORPH -->
  <div class="liquid-cursor-dot"></div>
  <div class="liquid-cursor-aura"></div>
  <div class="liquid-morph-overlay"></div>

  <!-- ACTIVE THEORY TOP HEADER BAR -->
  <header class="at-header-bar">
    <div class="at-brand">
      <div class="at-brand-box">E</div>
      <div>
        <div class="at-brand-title">E-WORLD</div>
        <div class="at-brand-sub">CREATIVE DIGITAL REALMS</div>
      </div>
    </div>

    <!-- Center Active Scene Telemetry -->
    <div id="at-scene-indicator" class="at-scene-indicator">
      [ 01 / 07 // NEXUS PROTOCOL ]
    </div>

    <!-- Right Controls: View Switcher & Audio Visualizer -->
    <div class="at-header-right">
      <div class="at-mode-switcher">
        <button class="at-mode-btn active" data-mode="tree">TREE [SCROLL]</button>
        <button class="at-mode-btn" data-mode="matrix">INDEX [LIST]</button>
      </div>

      <div id="at-audio-toggle" class="at-audio-cluster" title="Toggle Synthesized Audio">
        <div class="at-spectrum-bars">
          <div class="at-spec-bar"></div>
          <div class="at-spec-bar"></div>
          <div class="at-spec-bar"></div>
          <div class="at-spec-bar"></div>
          <div class="at-spec-bar"></div>
          <div class="at-spec-bar"></div>
          <div class="at-spec-bar"></div>
          <div class="at-spec-bar"></div>
        </div>
        <span id="at-audio-label" class="at-audio-label">AUDIO: ON</span>
      </div>
    </div>
  </header>

  <!-- MODE 1: VERTICAL BRANCHING TREE SCROLL VIEWPORT -->
  <main id="tree-viewport" class="tree-viewport">
    <div class="tree-container">
      <!-- Central Glowing Energy Trunk Line -->
      <div class="tree-trunk-line-bg"></div>
      <div id="tree-trunk-progress" class="tree-trunk-line-progress"></div>

      <!-- Injected Branch Nodes -->
      <div id="tree-nodes-container">
        <!-- Injected dynamically by TreeScroll.js -->
      </div>
    </div>
  </main>

  <!-- MODE 2: ACTIVE THEORY TECHNICAL INDEX MATRIX VIEW -->
  <section id="matrix-viewport" class="matrix-viewport">
    <div class="matrix-container">
      <div class="matrix-toolbar">
        <div class="matrix-search-box">
          <span style="color: var(--cyan-primary);">🔍</span>
          <input type="text" id="matrix-search-input" class="matrix-search-input" placeholder="SEARCH REALMS, TOURNAMENTS, CREATORS..." />
        </div>

        <div class="matrix-filters">
          <button class="matrix-filter-chip active" data-category="all">ALL ENTRIES</button>
          <button class="matrix-filter-chip" data-category="realms">REALMS</button>
          <button class="matrix-filter-chip" data-category="esports">TOURNAMENTS</button>
          <button class="matrix-filter-chip" data-category="creators">CREATORS</button>
          <button class="matrix-filter-chip" data-category="council">COUNCIL</button>
        </div>
      </div>

      <table class="matrix-table">
        <thead>
          <tr>
            <th style="width: 80px;">IDX</th>
            <th>REALM / ENTITY</th>
            <th style="width: 220px;">CATEGORY</th>
            <th style="width: 140px;">STATUS</th>
            <th style="width: 120px;">ACTION</th>
          </tr>
        </thead>
        <tbody id="matrix-table-body">
          <!-- Injected dynamically by IndexMatrix.js -->
        </tbody>
      </table>
    </div>
  </section>

  <!-- ACTIVE THEORY BOTTOM FOOTER BAR -->
  <footer class="at-footer-bar">
    <div class="at-footer-left">
      <div class="at-status-pill">
        <span class="pulse-dot pulse-dot-cyan"></span>
        <span>CORE: 24/7 ONLINE</span>
      </div>
      <span id="hud-live-clock">18:45:00 UTC</span>
    </div>

    <!-- Center Pagination Scrub Dots -->
    <div class="at-footer-center">
      <div class="at-scrub-dot active" data-index="0" title="Node 01: Nexus Root"></div>
      <div class="at-scrub-dot" data-index="1" title="Node 02: SMP Branch"></div>
      <div class="at-scrub-dot" data-index="2" title="Node 03: RP Branch"></div>
      <div class="at-scrub-dot" data-index="3" title="Node 04: Galaxy Junction"></div>
      <div class="at-scrub-dot" data-index="4" title="Node 05: Esports Branch"></div>
      <div class="at-scrub-dot" data-index="5" title="Node 06: Creators Branch"></div>
      <div class="at-scrub-dot" data-index="6" title="Node 07: Apex Gateway"></div>
    </div>

    <div class="at-footer-right">
      <span id="hud-coord-indicator">0x00 // NEXUS_ORIGIN</span>
      <a href="https://discord.gg/eworld" target="_blank" rel="noopener" style="color: var(--cyan-primary); text-decoration: none; font-weight: 600;">
        JOIN DISCORD ↗
      </a>
    </div>
  </footer>

  <!-- FULLSCREEN LIQUID DETAIL MODAL -->
  <div id="general-modal" class="modal-overlay">
    <div class="modal-content">
      <button class="modal-close" onclick="document.getElementById('general-modal').classList.remove('active')">✕</button>
      <h3 id="modal-title" style="font-size: 1.6rem; margin-bottom: 1rem;">Protocol Transmission</h3>
      <div id="modal-body">
        <!-- Injected dynamically by LiquidDetailModal.js -->
      </div>
    </div>
  </div>

  <!-- MAIN APPLICATION ENTRYPOINT -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
